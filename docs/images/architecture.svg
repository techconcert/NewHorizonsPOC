<text x="990.0" y="270" font-size="19" font-weight="700" fill="#7bd88f" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Systems</text>
<text x="990.0" y="300" font-size="16" font-weight="400" fill="#e8ecff" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Travel, supply, events,</text>
<text x="990.0" y="324" font-size="16" font-weight="400" fill="#e8ecff" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">expedition, colony, research</text>
<rect x="835" y="348" width="310" height="98" rx="12" fill="#141b36" stroke="#7bd88f" stroke-width="2"/>
<text x="990.0" y="380" font-size="19" font-weight="700" fill="#7bd88f" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Seeded RNG</text>
