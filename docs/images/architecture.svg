<text x="340.0" y="552" font-size="16" font-weight="400" fill="#e8ecff" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Hulls, events, terrain, techs,</text>
<text x="340.0" y="576" font-size="16" font-weight="400" fill="#e8ecff" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">planets. Validated at build time.</text>
<rect x="650" y="490" width="420" height="110" rx="12" fill="#141b36" stroke="#ff8a65" stroke-width="2"/>
<text x="860.0" y="522" font-size="19" font-weight="700" fill="#ff8a65" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Save layer</text>
<text x="860.0" y="552" font-size="16" font-weight="400" fill="#e8ecff" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">IndexedDB: seed plus command log</text>
<text x="860.0" y="576" font-size="16" font-weight="400" fill="#e8ecff" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Replay checked against saved state</text>
