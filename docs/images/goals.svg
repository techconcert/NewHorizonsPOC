 cy="76" r="1.2" fill="#fff" opacity="0.9"/><circle cx="254" cy="135" r="0.8" fill="#fff" opacity="0.3"/><circle cx="169" cy="320" r="1.2" fill="#fff" opacity="0.9"/><circle cx="439" cy="359" r="0.8" fill="#fff" opacity="0.3"/><circle cx="968" cy="402" r="0.8" fill="#fff" opacity="0.9"/><circle cx="600" cy="188" r="1.6" fill="#fff" opacity="0.5"/><circle cx="772" cy="142" r="1.6" fill="#fff" opacity="0.9"/><circle cx="863" cy="482" r="1.6" fill="#fff" opacity="0.7"/><circle cx="813" cy="123" r="1" fill="#fff" opacity="0.9"/><circle cx="536" cy="285" r="1.6" fill="#fff" opacity="0.3"/><circle cx="1184" cy="54" r="0.8" fill="#fff" opacity="0.7"/><circle cx="365" cy="515" r="1" fill="#fff" opacity="0.9"/><circle cx="141" cy="413" r="0.8" fill="#fff" opacity="0.3"/><circle cx="268" cy="503" r="1.2" fill="#fff" opacity="0.9"/><circle cx="479" cy="367" r="1.2" fill="#fff" opacity="0.9"/><circle cx="358" cy="273" r="1.2" fill="#fff" opacity="0.3"/><circle cx="324" cy="281" r="1.6" fill="#fff" opacity="0.3"/><circle cx="678" cy="269" r="1" fill="#fff" opacity="0.7"/><circle cx="352" cy="463" r="1" fill="#fff" opacity="0.9"/><circle cx="485" cy="211" r="1.2" fill="#fff" opacity="0.5"/><circle cx="960" cy="230" r="0.8" fill="#fff" opacity="0.9"/><circle cx="374" cy="206" r="0.8" fill="#fff" opacity="0.9"/><circle cx="566" cy="212" r="1.2" fill="#fff" opacity="0.9"/><circle cx="972" cy="189" r="1.2" fill="#fff" opacity="0.3"/></g>
<text x="600" y="52" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Design pillars</text>
<rect x="40" y="90" width="340" height="190" rx="14" fill="#141b36" stroke="#4fc3f7" stroke-width="2"/>
<circle cx="76" cy="128" r="20" fill="#4fc3f7"/><text x="76" y="135" font-size="20" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">1</text>
<text x="108" y="135" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Never overly complex</text>
<text x="64" y="180" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Few decisions, each one heavy. 6</text>
<text x="64" y="206" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">dials, 3 choices per card, 4</text>
<text x="64" y="232" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">resources.</text>
<rect x="430" y="90" width="340" height="190" rx="14" fill="#141b36" stroke="#ffd166" stroke-width="2"/>
<circle cx="466" cy="128" r="20" fill="#ffd166"/><text x="466" y="135" font-size="20" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">2</text>
<text x="498" y="135" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Macro only</text>
<text x="454" y="180" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The player sets policy. Ships,</text>
<text x="454" y="206" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">explorers, colonists and natives act</text>
<text x="454" y="232" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">on their own.</text>
<rect x="820" y="90" width="340" height="190" rx="14" fill="#141b36" stroke="#7bd88f" stroke-width="2"/>
<circle cx="856" cy="128" r="20" fill="#7bd88f"/><text x="856" y="135" font-size="20" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">3</text>
<text x="888" y="135" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Show the odds</text>
<text x="844" y="180" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Every decision previews its effect</text>
<text x="844" y="206" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">before you commit. No hidden math.</text>
<rect x="235" y="300" width="340" height="190" rx="14" fill="#141b36" stroke="#c792ea" stroke-width="2"/>
<circle cx="271" cy="338" r="20" fill="#c792ea"/><text x="271" y="345" font-size="20" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">4</text>
<text x="303" y="345" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Visuals matter</text>
<text x="259" y="390" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Civ6-inspired look, strongest zoomed</text>
<text x="259" y="416" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">into a colony. Inspired, never</text>
<text x="259" y="442" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">copied.</text>
<rect x="625" y="300" width="340" height="190" rx="14" fill="#141b36" stroke="#ff8a65" stroke-width="2"/>
<circle cx="661" cy="338" r="20" fill="#ff8a65"/><text x="661" y="345" font-size="20" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">5</text>
<text x="693" y="345" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Performance is a feature</text>
<text x="649" y="390" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">60 fps target, 30 fps floor on a</text>
<text x="649" y="416" font-size="17" font-weight="400" fill="#c8d0ee" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">mid-range laptop.</text>
</svg>
